    <script>
      // Prevent pinch zoom and gesture zoom on mobile devices
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      });
      
      // Prevent multi-touch pinch zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // Prevent double-tap zoom
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        var now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          // Allow default for buttons/inputs if needed, but prevent double-tap zoom
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON')) {
            // let default happen
          } else {
            e.preventDefault();
          }
        }
        lastTouchEnd = now;
      }, false);
    </script>
    
    <script>
      // Gracefully capture any cross-origin script-level failures (such as blocked ad networks or tracking scripts)
      // and suppress "Script error." or failed external telemetry script logs so they do not taint the app environment.
      window.addEventListener('error', function(event) {
        if (event.message === "Script error." || (event.filename && !event.filename.includes(window.location.host))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.stack && !event.reason.stack.includes(window.location.host)) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
